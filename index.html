    <meta name="theme-color" id="theme-color" content="#0B0F19" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Set the theme before first paint (brand default: Researcher Midnight Scholar).
      try {
        var t = localStorage.getItem("mt-theme");
        if (t !== "light" && t !== "dark") t = "dark";
        if (t === "dark") {
          document.documentElement.classList.add("dark");
          document.documentElement.classList.remove("light");
        } else {
          document.documentElement.classList.add("light");
          document.documentElement.classList.remove("dark");
        }
        document.documentElement.style.colorScheme = t;
        var m = document.getElementById("theme-color");
        if (m) m.setAttribute("content", t === "dark" ? "#0B0F19" : "#F8FAFC");
      } catch (e) {}
    </script>
